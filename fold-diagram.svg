<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">
  <defs>
    <!-- Halftone dot pattern for the lifted flap in stage 2 -->
    <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="1.1" fill="#AE5E30" />
      <circle cx="5" cy="5" r="1.1" fill="#AE5E30" />
    </pattern>
    <!-- Arrow marker for motion and dimension lines -->
    <marker id="arrowHead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0.5 L 5 3 L 0 5.5 z" fill="#FBAF7C" />
    </marker>
    <marker id="arrowHeadInk" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M 0 0.5 L 4 2.5 L 0 4.5 z" fill="#803B07" />
    </marker>
  </defs>

  <!-- Technical drawing background card / paper surface -->
  <rect x="0" y="0" width="320" height="220" rx="10" fill="#F8F4F1" />

  <!-- Outer drafting boundary & fine registration marks -->
  <rect x="8" y="8" width="304" height="204" rx="6" fill="none" stroke="#AE5E30" stroke-width="0.75" stroke-opacity="0.4" />
  
  <!-- Subtle corner crosshairs / registration marks -->
  <path d="M 16 12 L 16 20 M 12 16 L 20 16" stroke="#803B07" stroke-width="0.8" stroke-opacity="0.6" />
  <path d="M 304 12 L 304 20 M 300 16 L 308 16" stroke="#803B07" stroke-width="0.8" stroke-opacity="0.6" />
  <path d="M 16 200 L 16 208 M 12 204 L 20 204" stroke="#803B07" stroke-width="0.8" stroke-opacity="0.6" />
  <path d="M 304 200 L 304 208 M 300 204 L 308 204" stroke="#803B07" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- Horizontal baseline grid & ruler ticks across bottom -->
  <line x1="18" y1="185" x2="302" y2="185" stroke="#AE5E30" stroke-width="1.2" />
  <!-- Ruler tick marks -->
  <path d="
    M 20 185 L 20 178 M 28 185 L 28 181 M 36 185 L 36 181 M 44 185 L 44 181 M 52 185 L 52 178
    M 60 185 L 60 181 M 68 185 L 68 181 M 76 185 L 76 181 M 84 185 L 84 178
    M 92 185 L 92 181 M 100 185 L 100 181 M 108 185 L 108 181 M 116 185 L 116 178
    M 124 185 L 124 181 M 132 185 L 132 181 M 140 185 L 140 181 M 148 185 L 148 178
    M 156 185 L 156 181 M 164 185 L 164 181 M 172 185 L 172 181 M 180 185 L 180 178
    M 188 185 L 188 181 M 196 185 L 196 181 M 204 185 L 204 181 M 212 185 L 212 178
    M 220 185 L 220 181 M 228 185 L 228 181 M 236 185 L 236 181 M 244 185 L 244 178
    M 252 185 L 252 181 M 260 185 L 260 181 M 268 185 L 268 181 M 276 185 L 276 178
    M 284 185 L 284 181 M 292 185 L 292 181 M 300 185 L 300 178"
    stroke="#AE5E30" stroke-width="1" stroke-linecap="round" />

  <!-- Stage Dividers (vertical subtle guide lines) -->
  <line x1="112" y1="28" x2="112" y2="175" stroke="#AE5E30" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.5" />
  <line x1="222" y1="28" x2="222" y2="175" stroke="#AE5E30" stroke-width="0.75" stroke-dasharray="2 3" stroke-opacity="0.5" />

  <!-- Stage indicator geometric symbols at top (dots / marks instead of numbers) -->
  <circle cx="65" cy="34" r="3" fill="#803B07" />
  
  <circle cx="163" cy="34" r="3" fill="#803B07" />
  <circle cx="171" cy="34" r="3" fill="#803B07" />
  
  <circle cx="261" cy="34" r="3" fill="#803B07" />
  <circle cx="269" cy="34" r="3" fill="#803B07" />
  <circle cx="277" cy="34" r="3" fill="#803B07" />

  <!-- ==================== STAGE 1: Flat sheet with crease line ==================== -->
  <g id="stage1">
    <!-- Paper shadow/edge in isometric/technical view -->
    <polygon points="26,149 26,151 104,151 104,149" fill="#1B140F" opacity="0.3" />
    
    <!-- Flat sheet (slight perspective/oblique projection for clarity) -->
    <!-- Front/top face: width 76px, height 96px; oblique tilt -->
    <polygon points="28,52 104,52 104,148 28,148" fill="#F8F4F1" stroke="#803B07" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Center crease line (vertical dashed down middle at x=66) -->
    <line x1="66" y1="46" x2="66" y2="154" stroke="#AE5E30" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" />
    
    <!-- Top & bottom alignment marks on the fold line -->
    <path d="M 63 46 L 69 46 M 63 154 L 69 154" stroke="#803B07" stroke-width="1.5" stroke-linecap="round" />

    <!-- Corner technical ticks inside the sheet -->
    <path d="M 34 58 L 34 64 M 34 58 L 40 58" stroke="#AE5E30" stroke-width="1" stroke-linecap="round" />
    <path d="M 98 58 L 98 64 M 98 58 L 92 58" stroke="#AE5E30" stroke-width="1" stroke-linecap="round" />
    <path d="M 34 142 L 34 136 M 34 142 L 40 142" stroke="#AE5E30" stroke-width="1" stroke-linecap="round" />
    <path d="M 98 142 L 98 136 M 98 142 L 92 142" stroke="#AE5E30" stroke-width="1" stroke-linecap="round" />

    <!-- Technical fold indication symbols at top and bottom of crease -->
    <polygon points="66,42 63,45 69,45" fill="#AE5E30" />
    <polygon points="66,158 63,155 69,155" fill="#AE5E30" />
  </g>

  <!-- ==================== STAGE 2: Lifting and folding half ==================== -->
  <g id="stage2">
    <!-- Base left half (remains flat on the surface) -->
    <rect x="134" y="52" width="38" height="96" fill="#F8F4F1" stroke="#803B07" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Crease spine at x=172 -->
    <line x1="172" y1="49" x2="172" y2="151" stroke="#803B07" stroke-width="2" stroke-linecap="round" />

    <!-- Lifted flap (perspective quad rotating up and over toward the left) -->
    <!-- Base is along the fold (172, 52) to (172, 148). Flap lifts up-right in 3D projection -->
    <polygon points="172,52 195,43 195,139 172,148" fill="#FFDDB0" stroke="#803B07" stroke-width="2" stroke-linejoin="round" />
    <!-- Halftone pattern fill over the lifted flap -->
    <polygon points="172,52 195,43 195,139 172,148" fill="url(#halftone)" stroke="none" />

    <!-- Ghost/original outline of the right half showing path of movement -->
    <rect x="172" y="52" width="38" height="96" fill="none" stroke="#AE5E30" stroke-width="1.2" stroke-dasharray="2 3" />

    <!-- Dynamic curved fold arrow swinging from right over to the left -->
    <!-- Path swoops up and over the crease line -->
    <path d="M 204 100 C 208 68 165 48 144 72" fill="none" stroke="#FBAF7C" stroke-width="3.5" stroke-linecap="round" />
    <!-- Arrowhead pointing down-left onto the left half -->
    <path d="M 144 72 L 152 70 L 146 79 Z" fill="#803B07" stroke="#803B07" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Subtle motion arc lines -->
    <path d="M 198 126 C 205 106 186 86 166 94" fill="none" stroke="#AE5E30" stroke-width="1" stroke-dasharray="2 2" stroke-linecap="round" />
    
    <!-- Technical drafting hinge/pivot mark at top & bottom of crease -->
    <circle cx="172" cy="52" r="2.5" fill="#F8F4F1" stroke="#1B140F" stroke-width="1.5" />
    <circle cx="172" cy="148" r="2.5" fill="#F8F4F1" stroke="#1B140F" stroke-width="1.5" />
  </g>

  <!-- ==================== STAGE 3: Folded sheet (half width, 2x thick) ==================== -->
  <g id="stage3">
    <!-- Bottom layer of folded sheet -->
    <!-- Offset by 3px downward and rightward to clearly depict double thickness -->
    <path d="M 251 55 L 289 55 L 289 151 L 251 151 Z" fill="#FFDDB0" stroke="#803B07" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Visible edges between layers for the 2x thickness effect -->
    <polygon points="251,151 289,151 289,148 251,148" fill="#1B140F" opacity="0.25" />
    <polygon points="286,55 289,55 289,151 286,148" fill="#1B140F" opacity="0.25" />

    <!-- Top layer of folded sheet -->
    <rect x="248" y="52" width="38" height="96" fill="#F8F4F1" stroke="#803B07" stroke-width="2" stroke-linejoin="round" />

    <!-- Folded spine on the left (thick rounded crease edge) -->
    <line x1="248" y1="52" x2="248" y2="148" stroke="#803B07" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Layer edge lines at the right edge showing 2 distinct plies -->
    <line x1="286" y1="52" x2="286" y2="148" stroke="#803B07" stroke-width="1.2" />
    <line x1="289" y1="55" x2="289" y2="151" stroke="#803B07" stroke-width="1.5" />

    <!-- Profile zoom / thickness indicator bracket beside the bottom corner -->
    <!-- Technical callout showing the doubled edge with upward arrow -->
    <!-- Dimension extension lines -->
    <line x1="294" y1="148" x2="304" y2="148" stroke="#AE5E30" stroke-width="1" />
    <line x1="294" y1="151" x2="304" y2="151" stroke="#AE5E30" stroke-width="1" />
    
    <!-- Bold upward accent arrow indicating thickness doubling (2x) -->
    <line x1="299" y1="162" x2="299" y2="143" stroke="#FBAF7C" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="299,138 296,145 302,145" fill="#803B07" stroke="#803B07" stroke-width="1" stroke-linejoin="round" />

    <!-- Two small tick marks indicating 2 layers ("||") drafting style -->
    <line x1="297" y1="166" x2="297" y2="171" stroke="#1B140F" stroke-width="1.5" stroke-linecap="round" />
    <line x1="301" y1="166" x2="301" y2="171" stroke="#1B140F" stroke-width="1.5" stroke-linecap="round" />

    <!-- Width comparison dimension line underneath Stage 3 showing 1/2 width -->
    <line x1="248" y1="159" x2="286" y2="159" stroke="#AE5E30" stroke-width="1" />
    <line x1="248" y1="156" x2="248" y2="162" stroke="#AE5E30" stroke-width="1" />
    <line x1="286" y1="156" x2="286" y2="162" stroke="#AE5E30" stroke-width="1" />
    <circle cx="267" cy="159" r="1.5" fill="#AE5E30" />
  </g>

  <!-- Technical framing details: Title block / Drafting symbol plate at top left -->
  <g id="drafting-plate" opacity="0.8">
    <rect x="24" y="20" width="18" height="6" fill="none" stroke="#AE5E30" stroke-width="1" />
    <line x1="30" y1="20" x2="30" y2="26" stroke="#AE5E30" stroke-width="1" />
    <line x1="36" y1="20" x2="36" y2="26" stroke="#AE5E30" stroke-width="1" />
  </g>
</svg>